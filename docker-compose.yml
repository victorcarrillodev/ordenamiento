services:
  db:
    # Postgres a secas: ya no hace falta pgvector. La búsqueda por contenido
    # usa full-text nativo (ver backend/schema.sql).
    #
    # AL ACTUALIZAR UN VOLUMEN QUE YA EXISTÍA: arranca una última vez con
    # `pgvector/pgvector:pg16` para que schema.sql ejecute los DROP de
    # participation_chunks, skill_knowledge y la extensión; después cambia a
    # esta imagen. En un volumen nuevo no hay nada que migrar.
    image: postgres:16
    container_name: ordenamiento-db
    restart: unless-stopped
    mem_limit: 1024m
    mem_reservation: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ordenamiento
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ordenamiento']
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin `ports:`: solo alcanzable desde otros contenedores de esta red.

  backend:
    build: ./backend
    container_name: ordenamiento-backend
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 128m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun -e "fetch(''http://127.0.0.1:5920/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ordenamiento
      SESSION_SECRET: ${SESSION_SECRET}
      ROOT_EMAIL: ${ROOT_EMAIL:-root@ordenamiento.gob.mx}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-}
      ROOT_NAME: ${ROOT_NAME:-Administrador Root}
      PORT: 5920
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_UPLOAD_FILES: ${MAX_UPLOAD_FILES:-5}
    volumes:
      - uploads:/app/uploads
      # Cuentas admin extra (ej. la de Leo). Copia backend/seed-admins.example.json
      # a backend/seed-admins.json y descomenta la línea de abajo:
      # - ./backend/seed-admins.json:/app/seed-admins.json:ro
    # Sin `ports:`: solo el contenedor `web` le habla, por la red interna.

  web:
    build: .
    container_name: ordenamiento-web
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:44100/ordena/participation'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      BACKEND_URL: http://backend:5920
      BASE_PATH: /ordena
      PORT: 44100
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_UPLOAD_FILES: ${MAX_UPLOAD_FILES:-5}
    ports:
      # Compatible con la configuración de Apache (43100) y acceso directo (44100)
      - '127.0.0.1:43100:44100'
      - '127.0.0.1:44100:44100'

volumes:
  pgdata:
  uploads:
