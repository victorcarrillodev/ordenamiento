# Fragmento de referencia para el `server {}` de ac.tlaquepaque.gob.mx.
# Monta la app en /ordena reenviando al contenedor `web` (docker-compose.yml
# de la raíz), publicado en 127.0.0.1:44100.
#
# La barra final en `location /ordena/` y en `proxy_pass http://.../` es la
# que hace que nginx quite el prefijo /ordena antes de reenviar la petición
# al contenedor. Así la app sigue viviendo en `/`, `/admin`, `/login`, etc.
# tal cual está escrita hoy — sin cambios de código, sin rutas dobles.
#
# Requiere: `docker compose up -d --build` corriendo en el servidor con el
# docker-compose.yml de la raíz de este repo (no el de backend/, que es solo
# para desarrollo del backend por separado).

location /ordena/ {
    proxy_pass http://127.0.0.1:44100/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket / HMR no se usa en producción, pero no estorba dejarlo:
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# Si alguien entra a /ordena sin la barra final, redirige a /ordena/ para que
# el bloque de arriba lo capture (si no, nginx no hace match del location).
location = /ordena {
    return 301 /ordena/;
}
