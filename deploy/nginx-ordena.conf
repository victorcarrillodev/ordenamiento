# Fragmento de referencia para el `server {}` de ac.tlaquepaque.gob.mx.
# Monta la app en /ordena reenviando al contenedor `web` (docker-compose.yml
# de la raíz), publicado en 127.0.0.1:44100.
#
# TOLERANCIA A PICOS — definir UNA VEZ en el contexto http {} de nginx.conf
# (las zonas limit_req/limit_conn no pueden vivir dentro de server/location):
#
#   # Formulario público: 10 peticiones/min por IP con ráfaga de 5.
#   limit_req_zone $binary_remote_addr zone=ordena_form:10m rate=10r/m;
#   # Login admin: 30/min por IP (refuerza el rate-limit del backend).
#   limit_req_zone $binary_remote_addr zone=ordena_login:10m rate=30r/m;
#   # Conexiones concurrentes por IP al portal.
#   limit_conn_zone $binary_remote_addr zone=ordena_conn:10m;
#
# Y en los location correspondientes:
#   limit_req zone=ordena_form burst=5 nodelay;
#   limit_req status=429;
#
# La barra final en `location /ordena/` y en `proxy_pass http://.../` es la
# que hace que nginx quite el prefijo /ordena antes de reenviar la petición
# al contenedor. Así la app sigue viviendo en `/`, `/admin`, `/login`, etc.
# tal cual está escrita hoy — sin cambios de código, sin rutas dobles.
#
# Requiere: `docker compose up -d --build` corriendo en el servidor con el
# docker-compose.yml de la raíz de este repo (no el de backend/, que es solo
# para desarrollo del backend por separado).

location /ordena/ {
    proxy_pass http://127.0.0.1:44100/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket / HMR no se usa en producción, pero no estorba dejarlo:
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

