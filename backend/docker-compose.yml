services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ordenamiento-db
    restart: unless-stopped
    mem_limit: 1024m
    mem_reservation: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ordenamiento
    ports:
      # Solo loopback: este compose es para desarrollo local del backend por
      # separado. Sin esto, cualquiera en la misma red alcanzaría Postgres
      # con las credenciales por defecto de arriba.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ordenamiento']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: ordenamiento-api
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ordenamiento
      # Sin valor por defecto a propósito (ver nota equivalente en el
      # docker-compose.yml de la raíz): con NODE_ENV=production, auth.ts se
      # niega a arrancar si esto llega vacío.
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en tu .env (ver .env.example)}
      # Cuenta ROOT: se define en entorno/secrets (o `.env` gitignorado),
      # nunca hardcodeada aquí. Si falta, el seed falla en producción.
      ROOT_EMAIL: ${ROOT_EMAIL:-root@ordenamiento.gob.mx}
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      ROOT_NAME: ${ROOT_NAME:-Administrador Root}
      PORT: 5920
      NODE_ENV: production
    ports:
      # Solo loopback (ver nota en el servicio `db` de este mismo archivo).
      - '127.0.0.1:5920:5920'
    volumes:
      - uploads:/app/uploads
      # Archivo semilla opcional para crear más cuentas admin al arrancar.
      # Copia seed-admins.example.json a seed-admins.json (gitignorado) y
      # descomenta esta línea:
      # - ./seed-admins.json:/app/seed-admins.json:ro

volumes:
  pgdata:
  uploads:
